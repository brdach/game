<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Genius AI Terminal — Smart</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; font-family:'Courier New',monospace; background:#000; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }

  #sidePanel {
    position:absolute; top:16px; left:16px;
    width:340px; max-width:32vw; max-height:calc(100vh - 280px);
    display:flex; flex-direction:column; gap:12px;
    pointer-events:auto;
  }
  #imgCard {
    background:rgba(0,20,30,.9);
    border:1px solid rgba(0,255,204,.4);
    border-radius:10px; padding:8px;
    box-shadow:0 0 20px rgba(0,255,204,.15);
    opacity:0; transform:translateX(-20px);
    transition:.4s; overflow:hidden;
  }
  #imgCard.show { opacity:1; transform:translateX(0); }
  #imgCard img { width:100%; border-radius:6px; display:block; background:#001018; min-height:80px; }
  #imgCard .imgPlaceholder {
    width:100%; height:140px; border-radius:6px;
    background:linear-gradient(135deg,#0a1a2a,#001018);
    display:flex; align-items:center; justify-content:center;
    color:rgba(0,255,204,.4); font-size:12px;
  }
  #imgCard .imgCaption { color:#88aacc; font-size:10px; margin-top:6px; text-align:center; font-style:italic; }

  #textCard {
    background:rgba(0,20,30,.9);
    border:1px solid rgba(0,255,204,.4);
    border-radius:10px; padding:14px 16px;
    box-shadow:0 0 20px rgba(0,255,204,.15);
    opacity:0; transform:translateX(-20px);
    transition:.4s .1s;
    overflow-y:auto; flex:1; min-height:0;
    scrollbar-width:thin; scrollbar-color:#00ffcc transparent;
  }
  #textCard.show { opacity:1; transform:translateX(0); }
  #textCard::-webkit-scrollbar { width:5px; }
  #textCard::-webkit-scrollbar-thumb { background:#00ffcc; border-radius:3px; }

  #textCard .aiBadge {
    display:inline-block; background:rgba(0,255,204,.15);
    color:#00ffcc; padding:2px 8px; border-radius:10px;
    font-size:9px; letter-spacing:1px; margin-bottom:8px;
    border:1px solid rgba(0,255,204,.3);
  }
  #textCard .langBadge {
    display:inline-block; background:rgba(255,204,0,.12);
    color:#ffcc00; padding:2px 8px; border-radius:10px;
    font-size:9px; letter-spacing:1px; margin-left:4px;
    border:1px solid rgba(255,204,0,.3);
  }
  #textCard h4 { color:#00ffcc; font-size:15px; margin-bottom:8px; line-height:1.3; text-shadow:0 0 8px rgba(0,255,204,.4); }
  #textCard p { color:#b8d8e8; font-size:12px; line-height:1.6; margin-bottom:8px; }
  #textCard .stat {
    color:#88aacc; font-size:10.5px; font-style:italic;
    border-top:1px dashed rgba(0,255,204,.2);
    padding-top:8px; margin-top:8px;
  }
  #textCard .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  #textCard .chip {
    background:rgba(0,255,204,.08); color:#00ffcc;
    padding:2px 7px; border-radius:10px; font-size:9px;
    border:1px solid rgba(0,255,204,.2);
  }
  #textCard a { color:#00ffcc; text-decoration:none; font-size:11px; display:inline-block; margin-top:6px; }
  #textCard a:hover { text-decoration:underline; }

  #terminal {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    width:680px; max-width:94vw;
    background:rgba(6,14,22,.92);
    border:1px solid rgba(0,255,204,.5); border-radius:12px;
    padding:14px 16px; pointer-events:auto;
    box-shadow:0 0 30px rgba(0,255,204,.2);
  }
  #modeSwitch {
    display:flex; gap:0; margin-bottom:10px;
    border:1px solid rgba(0,255,204,.3);
    border-radius:6px; overflow:hidden;
  }
  .mode-btn {
    flex:1; background:rgba(0,0,0,.6);
    border:none; color:#557;
    padding:7px; font-family:inherit;
    font-size:11px; cursor:pointer;
    transition:.2s;
  }
  .mode-btn.active { background:rgba(0,255,204,.15); color:#00ffcc; }
  .mode-btn:hover:not(.active) { background:rgba(0,255,204,.05); color:#88ffee; }

  #terminal h3 {
    color:#00ffcc; font-size:12px; letter-spacing:2px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  #status { color:#ffcc00; font-size:11px; }

  #log {
    height:150px; overflow-y:auto; color:#88ffee; font-size:12px;
    margin-bottom:10px; padding-right:4px; line-height:1.55;
    scrollbar-width:thin; scrollbar-color:#00ffcc transparent;
  }
  #log::-webkit-scrollbar { width:5px; }
  #log::-webkit-scrollbar-thumb { background:#00ffcc; border-radius:3px; }
  #log > div { margin:4px 0; animation:fadein .25s; }
  @keyframes fadein { from { opacity:0; transform:translateX(-4px); } to { opacity:1; transform:none; } }
  #log .ok { color:#66ff88; }
  #log .err { color:#ff5577; }
  #log .info { color:#ffcc00; }
  #log .user { color:#00ffcc; font-weight:bold; }
  #log .ai { color:#b8d8e8; }
  #log .ai b { color:#00ffcc; }
  #log .ai code { background:rgba(0,255,204,.1); color:#00ffcc; padding:1px 5px; border-radius:3px; font-size:11px; }
  #log .ai ul { margin:4px 0 4px 16px; }
  #log .ai li { margin:2px 0; }
  #log .ai em { color:#ffcc00; font-style:normal; }
  #log .ai .answer {
    background:rgba(0,255,204,.08);
    border-left:3px solid #00ffcc;
    padding:8px 12px; margin:6px 0;
    border-radius:4px; display:block;
  }
  #log .thinking { color:rgba(0,255,204,.6); font-style:italic; font-size:11px; }
  #log .thinking::after { content:''; animation:dots 1.4s infinite; }
  @keyframes dots {
    0%,20% { content:''; }
    40% { content:'.'; }
    60% { content:'..'; }
    80%,100% { content:'...'; }
  }

  #inputRow { display:flex; gap:8px; }
  #cmd {
    flex:1; background:#000; border:1px solid rgba(0,255,204,.5);
    color:#00ffcc; padding:11px 14px; font-family:inherit;
    font-size:14px; border-radius:6px; outline:none;
  }
  #cmd:focus { box-shadow:0 0 12px rgba(0,255,204,.5); }
  #send {
    background:#00ffcc; color:#001a1a; border:none;
    padding:11px 22px; font-family:inherit; font-weight:bold;
    border-radius:6px; cursor:pointer; font-size:13px;
  }
  #send:hover:not(:disabled) { background:#66ffee; }
  #send:disabled { background:#335; color:#889; cursor:not-allowed; }

  #quickBtns { display:none; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  #quickBtns.show { display:flex; }
  #quickBtns button {
    background:rgba(0,255,204,.08);
    border:1px solid rgba(0,255,204,.25);
    color:#88ffee; padding:4px 10px;
    font-size:10.5px; border-radius:12px;
    cursor:pointer; font-family:inherit;
    transition:.2s;
  }
  #quickBtns button:hover { background:rgba(0,255,204,.2); color:#00ffcc; }

  #loading {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%); color:#00ffcc;
    text-align:center; opacity:0; transition:.3s;
    pointer-events:none;
  }
  #loading.show { opacity:1; }
  #loading .spinner {
    display:inline-block; width:36px; height:36px;
    border:3px solid rgba(0,255,204,.2);
    border-top-color:#00ffcc; border-radius:50%;
    animation:spin 1s linear infinite;
  }
  #loading .label { font-size:11px; margin-top:8px; color:#88ffee; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #fsHint {
    position:absolute; bottom:20px; right:20px;
    color:rgba(0,255,204,.5); font-size:11px;
    background:rgba(0,20,30,.6); padding:6px 12px;
    border-radius:6px; border:1px solid rgba(0,255,204,.2);
    pointer-events:auto; cursor:pointer; transition:.3s;
  }
  #fsHint:hover { color:#00ffcc; border-color:#00ffcc; }
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//   СЦЕНА
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1020);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(5, 4, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.02;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.target.set(0, 1.5, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
scene.add(new THREE.HemisphereLight(0xaaccff, 0x223344, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
scene.add(sun);

const grid = new THREE.GridHelper(40, 40, 0x00ffcc, 0x1a3a4a);
grid.material.opacity = 0.3; grid.material.transparent = true;
scene.add(grid);

const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(2.5, 2.7, 0.3, 48),
  new THREE.MeshStandardMaterial({
    color: 0x1a2535, metalness: 0.8, roughness: 0.3,
    emissive: 0x003340, emissiveIntensity: 0.4
  })
);
platform.position.y = -0.15; platform.receiveShadow = true;
scene.add(platform);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(2.6, 0.04, 8, 64),
  new THREE.MeshBasicMaterial({ color: 0x00ffcc })
);
ring.rotation.x = Math.PI / 2; ring.position.y = 0.02;
scene.add(ring);

// ============================================================
//   FULLSCREEN
// ============================================================
const fsHint = document.getElementById('fsHint');
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement
    || document.msFullscreenElement || document.mozFullScreenElement);
}
async function enterFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) await el.requestFullscreen();
    else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) await el.msRequestFullscreen();
  } catch { setStatus('⚠ fullscreen недоступен'); }
}
async function exitFullscreen() {
  try {
    if (document.exitFullscreen) await document.exitFullscreen();
    else if (document.webkitExitFullscreen) await document.webkitExitFullscreen();
  } catch {}
}
function toggleFullscreen() { if (isFullscreen()) exitFullscreen(); else enterFullscreen(); }
function updateFsHint() {
  fsHint.textContent = isFullscreen() ? 'ESC — выйти из полного экрана' : 'ESC — полный экран';
}
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
  document.addEventListener(ev, () => { updateFsHint(); setTimeout(resize, 100); });
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'Esc' || e.keyCode === 27) {
    if (!isFullscreen()) { e.preventDefault(); e.stopPropagation(); enterFullscreen(); }
  }
}, true);
fsHint.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

// ============================================================
//   УТИЛИТЫ
// ============================================================
function norm(s) {
  return (s || '').toLowerCase().replace(/[^\wа-яёa-z0-9 ]/gi, '').replace(/\s+/g, ' ').trim();
}
function abortableFetch(url, timeout = 7000) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), timeout);
  return fetch(url, { signal: ctrl.signal })
    .then(r => { clearTimeout(to); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(err => { clearTimeout(to); throw err; });
}

// ============================================================
//   ULTRA SEARCH
// ============================================================
const LANGS = ['ru', 'en', 'simple', 'de'];
const searchCache = new Map();

async function collectCandidates(query) {
  const all = new Map();
  const searches = [];
  for (const lang of LANGS) {
    searches.push(
      abortableFetch(`https://${lang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=10&namespace=0&format=json&origin=*&redirects=resolve`)
        .then(data => { if (data[1]) data[1].forEach((title, i) => {
          const key = `${lang}:${title}`;
          if (!all.has(key)) all.set(key, { title, lang, source: 'opensearch', pos: i });
        }); }).catch(() => {})
    );
    searches.push(
      abortableFetch(`https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=10&format=json&origin=*`)
        .then(data => { if (data.query?.search) data.query.search.forEach((r, i) => {
          const key = `${lang}:${r.title}`;
          if (!all.has(key)) all.set(key, { title: r.title, lang, source: 'search', pos: i });
        }); }).catch(() => {})
    );
    searches.push(
      abortableFetch(`https://${lang}.wikipedia.org/w/api.php?action=query&list=prefixsearch&pssearch=${encodeURIComponent(query)}&pslimit=5&format=json&origin=*`)
        .then(data => { if (data.query?.prefixsearch) data.query.prefixsearch.forEach((r, i) => {
          const key = `${lang}:${r.title}`;
          if (!all.has(key)) all.set(key, { title: r.title, lang, source: 'prefix', pos: i });
        }); }).catch(() => {})
    );
    searches.push(
      abortableFetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(query)}&language=${lang}&limit=5&format=json&origin=*`)
        .then(data => { if (data.search) data.search.forEach((r, i) => {
          const key = `wd:${r.id}`;
          if (!all.has(key)) all.set(key, { title: r.label || r.id, lang, source: 'wikidata', pos: i, qid: r.id });
        }); }).catch(() => {})
    );
  }
  await Promise.all(searches);
  return Array.from(all.values());
}

async function loadDetails(candidate) {
  const { title, lang } = candidate;
  const encoded = encodeURIComponent(title);

  const results = await Promise.allSettled([
    abortableFetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encoded}`),
    abortableFetch(`https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encoded}&prop=categories&cllimit=20&format=json&origin=*`),
    abortableFetch(`https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encoded}&prop=pageimages&piprop=original|thumbnail&pithumbsize=600&format=json&origin=*`)
  ]);

  const summary = results[0].status === 'fulfilled' ? results[0].value : null;
  const catsRes = results[1].status === 'fulfilled' ? results[1].value : null;
  const imgRes = results[2].status === 'fulfilled' ? results[2].value : null;

  if (!summary) return null;

  let categories = [];
  if (catsRes?.query?.pages) {
    const page = Object.values(catsRes.query.pages)[0];
    if (page?.categories) categories = page.categories.map(c => c.title.replace(/^(Категория|Category|Kategorie):/i, ''));
  }
  let image = summary.originalimage?.source || summary.thumbnail?.source || null;
  if (!image && imgRes?.query?.pages) {
    const page = Object.values(imgRes.query.pages)[0];
    image = page?.original?.source || page?.thumbnail?.source || null;
  }
  return {
    ...candidate, summary, categories, image,
    title: summary.title || title,
    extract: summary.extract || '',
    description: summary.description || '',
    url: summary.content_urls?.desktop?.page || `https://${lang}.wikipedia.org/wiki/${encoded}`
  };
}

function scoreCandidate(c, originalQuery) {
  const nq = norm(originalQuery);
  const nt = norm(c.title);
  let score = 0;
  if (nt === nq) score += 1000;
  else if (nt.startsWith(nq)) score += 400;
  else if (nt.includes(nq)) score += 200;
  else if (nq.includes(nt)) score += 100;

  const desc = (c.description || '').toLowerCase();
  if (desc === nq) score += 300;
  else if (desc.includes(nq)) score += 100;

  const ext = (c.extract || '').toLowerCase();
  if (ext.startsWith(nq)) score += 50;
  if (ext.includes(nq)) score += 25;
  const extLen = ext.length;
  if (extLen > 200) score += 15;
  if (extLen > 500) score += 25;
  if (extLen > 1000) score += 20;

  if (c.image) score += 60;
  score += Math.min((c.categories?.length || 0) * 3, 40);

  const isCyr = /[а-яё]/i.test(originalQuery);
  if (isCyr) {
    if (c.lang === 'ru') score += 150;
    else if (c.lang === 'en') score += 30;
    else score += 15;
  } else {
    if (c.lang === 'en') score += 150;
    else if (c.lang === 'ru') score += 30;
    else score += 15;
  }
  score += Math.max(0, 80 - (c.pos || 0) * 8);
  if (c.source === 'opensearch') score += 40;
  if (c.source === 'prefix') score += 30;
  if (c.source === 'search') score += 20;
  if (c.source === 'wikidata') score += 25;

  if (c.summary?.type === 'disambiguation') score -= 1000;
  if (!c.extract || c.extract.length < 30) score -= 200;
  return score;
}

async function ultraWikiSearch(query) {
  const cacheKey = norm(query);
  if (searchCache.has(cacheKey)) return searchCache.get(cacheKey);

  const candidates = await collectCandidates(query);
  if (!candidates.length) throw new Error('Ничего не найдено');

  const rough = candidates
    .map(c => ({ ...c, roughScore: scoreCandidate({ ...c, summary: null }, query) }))
    .sort((a, b) => b.roughScore - a.roughScore)
    .slice(0, 12);

  const detailed = (await Promise.all(rough.map(loadDetails))).filter(c => c && c.extract);
  if (!detailed.length) throw new Error('Не удалось загрузить данные');

  const scored = detailed
    .map(c => ({ ...c, score: scoreCandidate(c, query) }))
    .sort((a, b) => b.score - a.score);

  const best = scored[0];
  const result = {
    title: best.title,
    extract: best.extract,
    description: best.description,
    image: best.image,
    imageCaption: best.description || '',
    url: best.url,
    lang: best.lang,
    categories: best.categories,
    alternatives: scored.slice(1, 6).map(c => ({ title: c.title, lang: c.lang, description: c.description })),
    score: best.score
  };
  searchCache.set(cacheKey, result);
  return result;
}

// ============================================================
//   🧠 УМНОЕ ИЗВЛЕЧЕНИЕ ОТВЕТА ИЗ ТЕКСТА
//   Разбиваем extract на предложения, ищем нужное по типу вопроса
// ============================================================

// Разбить на предложения
function splitSentences(text) {
  return (text || '')
    .replace(/\s+/g, ' ')
    .split(/(?<=[.!?])\s+/)
    .map(s => s.trim())
    .filter(s => s.length > 10);
}

// Извлечь ответ на конкретный тип вопроса
function extractAnswer(info, questionType) {
  const sentences = splitSentences(info.extract);
  const desc = info.description || '';
  const title = info.title;

  // Паттерны для каждого типа вопроса
  const patterns = {
    where: /(находит|располож|стоит|возвыша|протека|проходит|в стране|в городе|в регионе|в части|на территории|на острове|на берегу|в центре|к северу|к югу|к востоку|к западу|между|граничит)/i,
    when: /(\d{3,4}\s*(год|г\.|году|года|до н\.э|н\.э)|в \d{3,4}|век[аеу]?|основан|построен|создан|открыт|родил|умер|произошл|начал|закончил|дата|датируется)/i,
    howmany: /\d+\s*(метр|км|кг|тонн|грамм|литр|мл|см|мм|процент|%|человек|жител|лет|год|дней|часов|секунд|штук|видов|штуки)/i,
    author: /(автор|написал|создал|изобрёл|изобрел|основал|разработал|сочинил|снял|построил|спроектировал|придумал)/i,
    why: /(потому что|из-за|по причине|вследствие|благодаря|так как|причина|объясняется|связано с|вызвано|является результатом)/i,
    how: /(работает|устроен|действует|функционирует|происходит|состоит из|механизм|процесс|принцип|схема|способ)/i,
    list: /(включает|включают|состоит из|делится на|бывают|выделяют|различают|среди них|такие как)/i,
    definition: /^/,
  };

  const pattern = patterns[questionType];

  if (!pattern) {
    // Общий ответ — первые 2 предложения
    return {
      short: desc || sentences[0] || '',
      full: sentences.slice(0, 2).join(' '),
    };
  }

  // Ищем предложения, подходящие под паттерн
  const matched = sentences.filter(s => pattern.test(s));

  if (questionType === 'howmany') {
    // Для «сколько» — извлекаем конкретное число с единицей
    const numMatch = info.extract.match(
      /(\d[\d\s,.]*)\s*(метр|м\b|км|километр|кг|килограмм|тонн|грамм|литр|мл|см|мм|процент|%|человек|жител|лет|год|дней|часов|секунд|штук|видов)/i
    );
    if (numMatch) {
      return {
        short: numMatch[0].trim(),
        full: matched[0] || numMatch[0],
      };
    }
  }

  if (matched.length) {
    return {
      short: matched[0],
      full: matched.slice(0, 2).join(' '),
    };
  }

  // Не нашли — fallback
  return {
    short: desc || sentences[0] || '',
    full: sentences.slice(0, 2).join(' '),
    notFound: true,
  };
}

// Тип вопроса — определяем, ЧТО именно спросили
function detectQuestionType(text) {
  const t = text.toLowerCase();
  if (/^(где|в каком месте|в какой стране|в каком городе)/i.test(t)) return 'where';
  if (/^(когда|в каком году|в каком веке|какого года)/i.test(t)) return 'when';
  if (/^(сколько|какова длина|какова высота|какова масса|каков вес|какой размер)/i.test(t)) return 'howmany';
  if (/^(кто написал|кто создал|кто автор|кто изобрёл|кто изобрел|кто основал|кто придумал|кто снял|кто построил)/i.test(t)) return 'author';
  if (/^(почему|зачем|отчего|по какой причине)/i.test(t)) return 'why';
  if (/^(как работает|как устроен|как происходит|как действует|как функционирует)/i.test(t)) return 'how';
  if (/^(перечисли|список|какие бывают|назови|какие есть)/i.test(t)) return 'list';
  if (/^(что такое|кто такой|кто такая|что за|определение)/i.test(t)) return 'definition';
  return 'general';
}

// Извлекаем СУТНОСТЬ из вопроса (что искать)
function extractEntity(text) {
  let t = text.trim();

  // Убираем вопросительные конструкции
  const patterns = [
    /^(что такое|кто такой|кто такая|кто такие|что за|определение)\s+/i,
    /^(где находится|где расположен|где стоит|где протекает|где)\s+/i,
    /^(когда основали|когда построили|когда создали|когда родился|когда умер|когда произошло|когда)\s+/i,
    /^(сколько весит|сколько стоит|сколько длина|сколько высота|сколько)\s+/i,
    /^(кто написал|кто создал|кто автор|кто изобрёл|кто изобрел|кто основал|кто придумал|кто снял|кто построил)\s+/i,
    /^(почему|зачем|отчего)\s+/i,
    /^(как работает|как устроен|как происходит|как действует)\s+/i,
    /^(перечисли|список|назови|какие бывают)\s+/i,
    /^(найди|поищи|покажи|открой|загрузи|расскажи про|расскажи о)\s+/i,
    /^(сравни)\s+/i,
  ];

  for (const p of patterns) {
    t = t.replace(p, '');
  }

  // Убираем знаки препинания и лишнее
  t = t.replace(/[?!.,;]+$/g, '').trim();
  t = t.replace(/^["«»"'"]+|["«»"'"]+$/g, '').trim();

  // «Войну и мир» → «Война и мир» (убираем падежи, грубо)
  // Просто оставляем как есть — Википедия найдёт и так

  return t;
}

function buildSmartResponse(info, questionType, originalQuestion) {
  const extracted = extractAnswer(info, questionType);

  // Заголовок ответа в зависимости от типа вопроса
  const labels = {
    where: '📍 Где находится',
    when: '📅 Когда',
    howmany: '📊 Сколько',
    author: '✍️ Автор',
    why: '❓ Почему',
    how: '⚙️ Как работает',
    list: '📋 Список',
    definition: '📖 Что такое',
    general: '📖 Ответ',
  };

  const label = labels[questionType] || '📖 Ответ';
  const title = info.title;

  let answer;
  if (questionType === 'definition' || questionType === 'general') {
    // Для «что такое» — краткое определение
    answer = `<b>${title}</b>`;
    if (info.description) answer += ` — ${info.description}`;
    answer += `<br><span class="answer">${extracted.full}</span>`;
  } else if (questionType === 'list' && extracted.short) {
    // Список
    const items = extracted.short.split(/[,;]/).map(s => s.trim()).filter(s => s.length > 1);
    if (items.length > 1) {
      answer = `<b>${title}</b>:<ul>${items.slice(0, 8).map(i => `<li>${i}</li>`).join('')}</ul>`;
    } else {
      answer = `<b>${title}</b>: ${extracted.short}`;
    }
  } else {
    // Конкретный ответ — «где/когда/сколько/кто/почему/как»
    answer = `<b>${title}</b><br><span class="answer">${extracted.short}</span>`;
    if (extracted.full !== extracted.short && extracted.full.length > extracted.short.length + 20) {
      answer += `<br><small style="color:#88aacc">${extracted.full}</small>`;
    }
  }

  // Если не нашли конкретики
  if (extracted.notFound) {
    answer += `<br><small style="color:#ffcc00">⚠ Не нашёл точного ответа в статье. Вот что есть:</small>`;
    answer += `<br>${splitSentences(info.extract).slice(0, 3).join(' ')}`;
  }

  answer += `<br><small style="color:#557">📚 ${info.lang?.toUpperCase()} Википедия`;
  if (info.categories?.length) answer += ` · ${info.categories[0]}`;
  answer += `</small>`;

  return answer;
}

function classifyQuery(text) {
  const t = text.toLowerCase().trim();

  // Базовые
  if (/^(привет|здравств|хай|hello|hi|ку|добрый)\b/i.test(t)) return { type: 'base', key: 'greeting' };
  if (/(спасибо|благодар|thanks|thank|thx)/i.test(t)) return { type: 'base', key: 'thanks' };
  if (/(пока|до свидания|bye|goodbye)/i.test(t)) return { type: 'base', key: 'goodbye' };
  if (/(как играть|как пользоваться|инструкц|правила|помощь|help)/i.test(t)) return { type: 'base', key: 'help' };
  if (/(команд|что можно|какие есть|функци)/i.test(t)) return { type: 'base', key: 'commands' };
  if (/(что ты умеешь|кто ты|расскажи о себе|как работаешь)/i.test(t)) return { type: 'base', key: 'about_ai' };
  if (/(как искать|совет.*поиск|как найти)/i.test(t)) return { type: 'base', key: 'search_tip' };
  if (/(википеди|wiki)/i.test(t) && !/(найди|поищи|что такое|кто такой|где|когда|почему|как)/i.test(t)) return { type: 'base', key: 'wiki' };
  if (/^(а что если|что будет если|что если)/i.test(t)) return { type: 'base', key: 'hypothetical' };

  // Сравнение
  const cmpMatch = t.match(/^(?:сравни|что общего|чем отлич|разниц[аы]? между)\s+(.+?)\s+(?:и|с|от|vs|против)\s+(.+)/i);
  if (cmpMatch) return { type: 'compare', a: cmpMatch[1].trim(), b: cmpMatch[2].trim() };

  // Continue/Followup
  if (/^(ещё|еще|больше|подробнее|продолжи|дальше)$/i.test(t) && dialogueMemory.currentTopic) {
    return { type: 'followup', topic: dialogueMemory.currentTopic, info: dialogueMemory.currentInfo };
  }

  // Определяем тип вопроса + извлекаем сущность
  const questionType = detectQuestionType(text);
  const entity = extractEntity(text);

  if (!entity || entity.length < 2) {
    return { type: 'base', key: 'empty' };
  }

  return { type: 'lookup', questionType, entity, originalQuestion: text };
}

let currentGroup = null;
let isTransitioning = false;
const textureCache = new Map();
const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

function loadTexture(url) {
  if (!url) return Promise.resolve(null);
  if (textureCache.has(url)) return Promise.resolve(textureCache.get(url));
  return new Promise(resolve => {
    loader.load(url,
      tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        textureCache.set(url, tex); resolve(tex);
      }, undefined, () => resolve(null));
  });
}

function makeSprite(tex) {
  const g = new THREE.Group();
  const aspect = tex.image.width / tex.image.height;
  const baseSize = 3.2;
  let w = baseSize, h = baseSize;
  if (aspect > 1) h = baseSize / aspect; else w = baseSize * aspect;

  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, toneMapped: false })
  );
  plane.position.y = h / 2 + 0.6; g.add(plane);

  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(w * 1.15, h * 1.15),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  glow.position.copy(plane.position); glow.position.z = -0.05;
  g.add(glow); g.userData.glow = glow;

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(w * 0.5, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 })
  );
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02;
  shadow.scale.set(1, h / w * 0.3, 1); g.add(shadow);

  const frame = new THREE.Mesh(
    new THREE.PlaneGeometry(w + 0.12, h + 0.12),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
  );
  frame.position.copy(plane.position); frame.position.z = -0.02;
  g.add(frame); g.userData.frame = frame;
  g.userData.plane = plane;
  return g;
}

function makePlaceholder(text) {
  const g = new THREE.Group();
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0a1a2a'; ctx.fillRect(0, 0, 256, 320);
  ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 6; ctx.strokeRect(8, 8, 240, 304);
  ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 64px monospace'; ctx.textAlign = 'center';
  ctx.fillText('?', 128, 150);
  ctx.font = '14px monospace'; ctx.fillStyle = '#88ffee';
  const words = text.split(' ');
  let y = 200;
  words.slice(0, 4).forEach(w => { ctx.fillText(w.slice(0, 18), 128, y); y += 22; });
  ctx.fillStyle = '#557788'; ctx.font = '11px monospace';
  ctx.fillText('нет картинки', 128, 290);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 3),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  plane.position.y = 2.1; g.add(plane);
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(2.9, 3.4),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false })
  );
  glow.position.y = 2.1; glow.position.z = -0.05;
  g.add(glow); g.userData.glow = glow; g.userData.plane = plane;
  return g;
}

function removeCurrentCharacter() {
  return new Promise(resolve => {
    if (!currentGroup) return resolve();
    const obj = currentGroup;
    const startTime = performance.now(); const duration = 350;
    function shrink() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      obj.scale.setScalar(Math.max(1 - progress, 0.001));
      obj.position.y = progress * 1.5;
      if (progress < 1) requestAnimationFrame(shrink);
      else {
        scene.remove(obj);
        obj.traverse?.(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        });
        currentGroup = null; resolve();
      }
    }
    shrink();
  });
}

function spawnSprite(group) {
  return new Promise(resolve => {
    group.position.set(0, 0, 0);
    group.scale.set(0.01, 0.01, 0.01);
    scene.add(group); currentGroup = group;
    const startTime = performance.now(); const duration = 500;
    function grow() {
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const c1 = 1.70158, c3 = c1 + 1;
      const eased = 1 + c3 * Math.pow(progress - 1, 3) + c1 * Math.pow(progress - 1, 2);
      group.scale.setScalar(eased);
      if (progress < 1) requestAnimationFrame(grow);
      else { group.scale.setScalar(1); resolve(); }
    }
    grow();
  });
}

async function materializeFromInfo(info) {
  if (isTransitioning) return;
  isTransitioning = true;
  try {
    let sprite;
    if (info.image) {
      const tex = await loadTexture(info.image);
      sprite = tex ? makeSprite(tex) : makePlaceholder(info.title);
    } else sprite = makePlaceholder(info.title);
    if (currentGroup) await removeCurrentCharacter();
    await spawnSprite(sprite);
    showSidePanel(info);
  } finally { isTransitioning = false; }
}

      holder.replaceWith(d);

  } else textChips.innerHTML = '';

  textStat.textContent = `категорий: ${info.categories?.length || 0} · релевантность: ${info.score || 0}`;

  if (info.url) { textLink.href = info.url; textLink.style.display = 'inline-block'; }

  textCard.classList.add('show');
}

}
function log(text, cls = '') {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 40) el.removeChild(el.firstChild);
}
function setStatus(txt) { document.getElementById('status').textContent = txt; }
function setLoading(on, label = 'поиск...') {
  document.getElementById('loading').classList.toggle('show', on);
  document.getElementById('loadingLabel').textContent = label;
}

// ============================================================
//   РЕЖИМЫ
// ============================================================
let termMode = 'search';
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    termMode = btn.dataset.mode;
    const cmd = document.getElementById('cmd');
    const send = document.getElementById('send');
    const title = document.getElementById('termTitle');
    const quick = document.getElementById('quickBtns');
    if (termMode === 'search') {
      title.textContent = '⌨ WIKI-ТЕРМИНАЛ · ПОИСК';
      cmd.placeholder = 'слово для поиска...';
      send.textContent = 'СОЗДАТЬ';
      quick.classList.remove('show');
    } else {
      title.textContent = '💬 GENIUS AI · ВОПРОС';
      cmd.placeholder = 'где / когда / кто / сколько / почему / как / что такое...';
      send.textContent = 'СПРОСИТЬ';
      quick.classList.add('show');
    }
    cmd.focus();
  });
});

document.querySelectorAll('#quickBtns button').forEach(btn => {
  btn.addEventListener('click', async () => {
    if (termMode !== 'question') document.querySelector('.mode-btn[data-mode="question"]').click();
    await handleAIQuestion(btn.dataset.q);
  });
});

// ============================================================
//   🤖 GENIUS AI HANDLER
// ============================================================
async function handleAIQuestion(userText) {
  const q = userText.trim();
  if (!q) return;

  logHTML(`👤 ${q}`, 'user');
  dialogueMemory.history.push({ role: 'user', text: q });

  const classification = classifyQuery(q);

  setStatus('🤖 ИИ думает...');
  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'thinking';
  thinkDiv.textContent = '🤖 Обрабатываю вопрос';
  document.getElementById('log').appendChild(thinkDiv);
  document.getElementById('log').scrollTop = 99999;

  await new Promise(r => setTimeout(r, 250 + Math.random() * 250));

  try {
    // === Базовые ответы ===
    if (classification.type === 'base') {
      const resp = BASE_RESPONSES[classification.key]
        ? pick(BASE_RESPONSES[classification.key])
        : pick(BASE_RESPONSES.empty);
      thinkDiv.remove();
      logHTML(`<b>🤖 ИИ:</b> ${resp.replace(/\n/g, '<br>')}`, 'ai');
      setStatus('готов');
      return;
    }

    // === Сравнение ===
    if (classification.type === 'compare') {
      thinkDiv.textContent = `🔍 Ищу «${classification.a}» и «${classification.b}»`;
      setStatus(`🔍 сравнение...`);
      setLoading(true, `сравниваю...`);

      const [infoA, infoB] = await Promise.all([
        ultraWikiSearch(classification.a).catch(() => null),
        ultraWikiSearch(classification.b).catch(() => null)
      ]);
      setLoading(false);
      thinkDiv.remove();

      if (!infoA || !infoB) {
        let err = 'Не смог найти обе статьи. ';
        if (!infoA) err += `Не нашёл «${classification.a}». `;
        if (!infoB) err += `Не нашёл «${classification.b}».`;
        logHTML(`<b>🤖 ИИ:</b> ${err}`, 'ai');
        setStatus('⚠ не найдено');
        return;
      }

      const catsA = new Set((infoA.categories || []).map(c => c.toLowerCase()));
      const catsB = new Set((infoB.categories || []).map(c => c.toLowerCase()));
      const common = [...catsA].filter(c => catsB.has(c));

      let result = `<b>Сравнение:</b><br>`;
      result += `<b>${infoA.title}</b> — ${infoA.description || ''}<br>`;
      result += `<b>${infoB.title}</b> — ${infoB.description || ''}<br>`;
      if (common.length) result += `<em>Общее:</em> ${common.slice(0, 5).join(', ')}`;

      logHTML(`<b>🤖 ИИ:</b> ${result}`, 'ai');
      dialogueMemory.currentTopic = infoA.title;
      dialogueMemory.currentInfo = infoA;
      rememberEntity(infoA.title);
      rememberEntity(infoB.title);

      await materializeFromInfo(infoA);
      setStatus('✓ готово');
      return;
    }

    // === Followup ===
    if (classification.type === 'followup' && classification.info) {
      thinkDiv.textContent = `📖 Углубляю тему «${classification.topic}»`;
      thinkDiv.remove();
      const info = classification.info;
      const sentences = splitSentences(info.extract);
      const extra = sentences.slice(3, 8).join(' ');
      logHTML(`<b>🤖 ИИ:</b> <b>${info.title}</b><br><span class="answer">${extra || 'Больше информации нет в кратком описании. Открой Википедию для деталей.'}</span>`, 'ai');
      await materializeFromInfo(info);
      setStatus('готов');
      return;
    }

    // === Lookup (УМНЫЙ ОТВЕТ НА ВОПРОС) ===
    if (classification.type === 'lookup') {
      const { questionType, entity } = classification;
      thinkDiv.textContent = `🔍 Ищу «${entity}»`;
      setStatus(`🔍 поиск: ${entity}`);
      setLoading(true, `поиск: ${entity}`);

      const info = await ultraWikiSearch(entity);
      setLoading(false);
      thinkDiv.remove();

      // Умный ответ по существу вопроса
      const answer = buildSmartResponse(info, questionType, q);

      logHTML(`<b>🤖 ИИ:</b> ${answer}`, 'ai');
      dialogueMemory.currentTopic = info.title;
      dialogueMemory.currentInfo = info;
      rememberEntity(info.title);

      // Материализуем с умным текстом в панели
      const sideText = extractAnswer(info, questionType);
      const sidePanelText = `${answer.replace(/<[^>]+>/g, '')}`;
      await materializeFromInfo(info);

      // Обновляем панель умным текстом
      if (sideText.short) {
        textBody.innerHTML = `<p>${sideText.short}</p>` +
          (sideText.full !== sideText.short
            ? `<p><small style="color:#88aacc">${sideText.full}</small></p>`
            : '');
      }

      setStatus('✓ готово');
      return;
    }

    // === Fallback ===
    thinkDiv.remove();
    logHTML(`<b>🤖 ИИ:</b> ${pick(BASE_RESPONSES.empty)}`, 'ai');
    setStatus('готов');

  } catch (err) {
    console.error(err);
    setLoading(false);
    if (thinkDiv.parentNode) thinkDiv.remove();
    logHTML(`<b>🤖 ИИ:</b> ❌ Не справился: ${err.message}. Попробуй переформулировать.`, 'ai');
    setStatus('⚠ ошибка');
  }
}

// ============================================================
//   ГЛАВНЫЙ ОБРАБОТЧИК
// ============================================================
async function handleCommand(raw) {
  const q = raw.trim();
  if (!q || isTransitioning) return;

  if (termMode === 'question') {
    await handleAIQuestion(q);
    return;
  }

  document.getElementById('send').disabled = true;
  setStatus('🔍 поиск...');
  setLoading(true, 'поиск в 4 языках...');
  log('→ ' + q, '');

  try {
    const info = await ultraWikiSearch(q);
    log(`найдено: ${info.title} [${info.lang}]`, 'ok');
    setStatus('🖼️ загрузка...');
    setLoading(true, 'загрузка картинки...');
    await materializeFromInfo(info);
    setStatus('✓ готово');
    setLoading(false);

    let comment = `Нашёл <b>${info.title}</b>`;
    if (info.description) comment += ` — ${info.description}`;
    comment += `. Материализовал! ✨`;
    logHTML(`<b>🤖 ИИ:</b> ${comment}`, 'ai');

    dialogueMemory.currentTopic = info.title;
    dialogueMemory.currentInfo = info;
    rememberEntity(info.title);

  } catch (err) {
    console.error(err);
    setLoading(false);
    setStatus('⚠ ' + err.message);
    log('❌ ' + err.message, 'err');

    if (currentGroup) await removeCurrentCharacter();
    const g = makePlaceholder(q);
    await spawnSprite(g);
    showSidePanel({
      title: q, extract: 'Не удалось найти статью.', description: 'нет данных',
      image: null, categories: [], score: 0, lang: null,
      url: `https://ru.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}`
    });
    logHTML(`<b>🤖 ИИ:</b> не нашёл «${q}». Попробуй синоним или спроси иначе.`, 'ai');
  } finally {
    document.getElementById('send').disabled = false;
    setTimeout(() => setStatus('готов'), 2000);
  }
}

document.getElementById('send').addEventListener('click', () => {
  const inp = document.getElementById('cmd');
  handleCommand(inp.value); inp.value = ''; inp.focus();
});
document.getElementById('cmd').addEventListener('keydown', e => {
  if (e.key === 'Enter') { handleCommand(e.target.value); e.target.value = ''; }
});

// ============================================================
//   АНИМАЦИЯ
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();
  ring.rotation.z += 0.005;
  ring.material.color.setHSL((t * 0.1) % 1, 0.85, 0.6);
  platform.material.emissiveIntensity = 0.4 + Math.sin(t * 2) * 0.15;

  if (currentGroup) {
    currentGroup.position.y = Math.sin(t * 1.2) * 0.08;
    const plane = currentGroup.userData.plane;
    if (plane) plane.lookAt(camera.position);
    const glow = currentGroup.userData.glow;
    if (glow) {
      glow.lookAt(camera.position);
      glow.material.opacity = 0.12 + Math.sin(t * 2.5) * 0.05;
    }
    const frame = currentGroup.userData.frame;
    if (frame) frame.lookAt(camera.position);
  }

  renderer.render(scene, camera);
}
animate();

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

updateFsHint();
setTimeout(() => document.getElementById('cmd').focus(), 100);
</script>
